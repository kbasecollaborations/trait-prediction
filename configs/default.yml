variance_threshold: 0.01 # if v=0.01, p=0.01 or 0.99
correlation_threshold: false # NOTE: Disabling correlation filtering for now
imbalanced: false # NOTE: Disabling imbalanced sampling for now
test_size: 0.3
n_splits: 5
phenotype_sample_size_threshold: 20
minor_class_sample_size_threshold: 10
shap_max_display: 10
scoring:
  [
    "accuracy",
    "balanced_accuracy",
    "precision",
    "recall",
    "f1",
    "roc_auc",
    "matthews_corrcoef",
  ]

count_features:
  [
    "rast",
    "kofam",
    "uniref30",
    "uniref50",
    "uniref70",
    "uniref90",
    "cluster30",
    "cluster50",
    "cluster70",
    "cluster90",
    "eggnog_kegg",
    "uniprot_trembl",
    "eggnog_seed",
    "combined",
  ]
float_features: ["kofam_modules", "NMF", "PCA"]
