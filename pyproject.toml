[project]
name = "trait-prediction"
version = "0.4.0"
description = "The pipeline to predict traits from genomic data using machine learning techniques."
authors = [
    {name = "Dileep Kishore", email = "k.dileep1994@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<=3.14"
dependencies = [
    "pandas>=2.2.3",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "jupyter>=1.0.0",
    "imblearn>=0.0",
    "shap>=0.46.0",
    "catboost>=1.2.1",
    "optuna>=3.3.0",
    "ipykernel>=6.25.1",
    "openpyxl>=3.1.2",
    "numba>=0.62.1",
    "numpy>=2.3.5",
    "pyarrow>=15.0.0",
    "polars>=0.20.10",
    "fuzzywuzzy>=0.18.0",
    "ete3>=3.1.3",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "pydantic>=2.7.1",
    "hydra-core>=1.3.2",
    "networkx>=3.3",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.1",
    "black>=23.7.0",
    "ipython>=8.20.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ete3 = { git = "https://github.com/etetoolkit/ete.git", rev = "ete3" }
